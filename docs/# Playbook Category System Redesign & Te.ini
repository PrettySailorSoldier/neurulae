## Implementation Recommendation for Antigravity

### Database Structure
```javascript
playbook: {
  id: string,
  title: string,
  description: string,
  isTemplate: boolean, // Distinguishes templates from user-created
  
  // Primary categorization
  primaryCategory: 'room' | 'activity' | 'time' | 'specialty',
  
  // Tags for filtering (multi-select)
  tags: {
    rooms: ['bathroom', 'bedroom', 'kitchen', 'living-room', 'office', 'entryway', 'garage', 'whole-home', 'vehicle'],
    activityType: ['deep-clean', 'quick-clean', 'declutter', 'organize', 'maintenance', 'seasonal', 'daily-routine'],
    duration: ['0-15', '15-30', '30-60', '60-120', '120+'], // in minutes
    specialty: ['speed-cleaning', 'zone-cleaning', 'self-care', 'outdoor']
  },
  
  // For template organization
  tier: 1 | 2 | 3 | 4, // Importance/visibility level
  
  // Existing fields
  steps: [...],
  totalTime: number,
  category: string // Keep for backward compatibility, but deprecate
}
```

### UI Component Structure
```jsx
<PlaybooksSection>
  <FilterBar>
    {/* Primary filter */}
    <PrimaryFilter 
      options={['All', 'By Room', 'By Activity', 'By Time', 'Templates']}
      selected={primaryFilter}
    />
    
    {/* Secondary filter (conditional) */}
    {primaryFilter !== 'All' && (
      <SecondaryFilter 
        options={getSecondaryOptions(primaryFilter)}
        selected={secondaryFilter}
      />
    )}
    
    {/* Template toggle */}
    <TemplateToggle checked={showTemplatesOnly} />
  </FilterBar>
  
  <PlaybookGrid>
    {/* Tiered display when showing templates */}
    {showTemplatesOnly && (
      <>
        <TierSection title="Essential Templates" tier={1} />
        <TierSection title="Room-Specific" tier={2} />
        <TierSection title="Specialty" tier={3} />
      </>
    )}
    
    {/* Regular display for filtered results */}
    {!showTemplatesOnly && (
      <PlaybookCards playbooks={filteredPlaybooks} />
    )}
  </PlaybookGrid>
</PlaybooksSection>
```

