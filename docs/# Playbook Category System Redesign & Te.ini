# Playbook Category System Redesign & Template Organization

## Problems with Current Category System

Looking at your screenshots, I can see several issues:

1. **Too many categories** - The horizontal scroll of 18+ categories is overwhelming and hard to navigate
2. **Unclear hierarchy** - Room-based categories (Bathroom, Kitchen) mixed with activity-based (Cleaning, Cooking) and goal-based (Self-Care, Health)
3. **Redundancy** - "Whole Home" overlaps with "Cleaning", room categories overlap with "Cleaning"
4. **No clear user mental model** - Users don't know whether to filter by room, activity type, or goal

## Recommended Category System Redesign

### Option 1: Two-Tier Filter System (RECOMMENDED)

**Primary Filter (Main Categories):**
```
All | By Room | By Activity | By Time | Templates
```

**Secondary Filters (appear based on primary selection):**

**When "By Room" selected:**
```
Bathroom | Bedroom | Kitchen | Living Room | Office | 
Entryway & Dining | Garage | Whole Home
```

**When "By Activity" selected:**
```
Deep Cleaning | Quick Cleaning | Decluttering | 
Organizing | Maintenance | Seasonal
```

**When "By Time" selected:**
```
5 Minutes | 15 Minutes | 30 Minutes | 1 Hour | 2+ Hours | Multi-Day
```

**When "Templates" selected:**
```
Show only pre-made template playbooks (marked with ✨ Template badge)
```

### Visual Layout:
```
┌─────────────────────────────────────────────────────────────┐
│ Playbooks                                    + Create Playbook│
│ Step-by-step guides for your goals                            │
├─────────────────────────────────────────────────────────────┤
│ [All] [By Room] [By Activity] [By Time] [Templates]          │
│                                                                │
│ Selected: By Room                                              │
│ [Bathroom] [Bedroom] [Kitchen] [Living Room] [Office]...      │
└─────────────────────────────────────────────────────────────┘
```

---

## Option 2: Tag-Based Multi-Select System

Instead of exclusive categories, use **multi-select tags** that let users combine filters:

```
Filter by: [Room ▾] [Type ▾] [Duration ▾] [Show Templates Only ☐]
```

**Room tags:**
- Bathroom, Bedroom, Kitchen, Living Room, Office, Entryway, Garage, Whole Home, Vehicle

**Type tags:**
- Deep Clean, Quick Clean, Declutter, Organize, Maintenance, Seasonal, Daily Routine

**Duration tags:**
- < 15 min, 15-30 min, 30-60 min, 1-2 hours, 2+ hours

**Template toggle:**
- Show only pre-made templates vs. show all (including user-created)

---

## Template Organization Strategy

### Template Naming Convention

Use clear, descriptive naming that includes key information:

```
[Type] - [Room/Area] - [Descriptor]

Examples:
✨ Deep Clean - Bathroom Reset
✨ Quick Clean - Kitchen (15 min)
✨ Declutter - Office Edition
✨ Weekly - Whole Home Blessing
✨ Seasonal - Spring Deep Clean
✨ Daily - Morning Reset Routine
```

### Template Hierarchy & Grouping

**Tier 1: Essential Templates** (always visible, most commonly used)
- Quick Clean - 15 Minute Express
- Deep Clean - Bathroom Reset
- Deep Clean - Kitchen Reset  
- Weekly - Whole Home Blessing
- Daily - Morning Reset Routine

**Tier 2: Room-Specific Templates** (grouped by room)
- **Bathroom:** Deep Clean, Quick Clean, Weekly Maintenance
- **Kitchen:** Deep Clean, Quick Clean, Weekly Maintenance
- **Bedroom:** Deep Clean, Quick Clean, Weekly Maintenance
- **Living Room:** Deep Clean, Quick Clean
- **Office:** Deep Clean, Declutter Master
- **Entryway:** Deep Clean
- **Garage:** Deep Clean

**Tier 3: Specialty Templates** (for specific needs)
- **Speed Cleaning:** 5-Min Power Reset, 30-Min Home Refresh, 1-Hour Power Clean
- **Decluttering:** Paper Avalanche, Kitchen Declutter, Closet Reset
- **Seasonal:** Spring Deep Clean, Fall Deep Clean
- **Maintenance:** Monthly Deep Clean, Laundry Day System
- **Zone Cleaning:** Zone 1, Zone 2, Zone 3, Zone 4, Zone 5
- **Self-Care:** Morning Reset, Evening Wind-Down, Meal Prep

**Tier 4: Vehicle & Outdoor**
- Car Reset - Calmer Commute

