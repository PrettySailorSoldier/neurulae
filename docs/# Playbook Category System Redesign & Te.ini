## Migration Path

### Phase 1: Add Tags (Don't Break Existing)
- Add tag fields to all existing playbooks
- Keep current category system working
- Add isTemplate flag to pre-made playbooks

### Phase 2: Implement New Filter UI
- Add new two-tier filter system above current categories
- Keep old categories temporarily for user familiarity
- Add "Try new filters" toggle

### Phase 3: Migrate Users
- Default to new system for new users
- Let existing users toggle between old/new
- Collect feedback

### Phase 4: Remove Old System
- After 2-4 weeks, remove old category bar
- Full migration to new filter system

---

## Summary of Recommendations

**Best Approach:** Option 1 (Two-Tier Filter System)
- Clear mental model for users
- Reduces visual overwhelm
- Supports both browsing and targeted search
- Scales as more templates are added

**Template Organization:**
- Use tier system (1-4) for importance/visibility
- Group templates by category when displaying
- Clear naming convention with type prefix
- Visual distinction (✨ badge) for templates

**Categories to Use:**
- Primary: All | By Room | By Activity | By Time | Templates
- Secondary: Context-dependent based on primary selection
- This reduces 18+ categories to 4 primary + focused secondary options

This system is **AuDHD-friendly** because it:
- Reduces decision paralysis (fewer primary choices)
- Provides clear visual hierarchy (tiers)
- Supports different mental models (room vs. activity vs. time)
- Allows discovery without overwhelming
- Works with both "I know what I want" and "help me find something" modes