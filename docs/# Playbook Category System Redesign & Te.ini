## Specific Changes for Antigravity

### 1. Remove Current Category Bar
Replace the horizontal scrolling category bar with the two-tier filter system.

### 2. Add Filter Logic
```javascript
function filterPlaybooks(playbooks, filters) {
  let filtered = playbooks;
  
  // Primary filter
  if (filters.primary === 'templates') {
    filtered = filtered.filter(p => p.isTemplate);
  }
  
  // Secondary filter
  if (filters.secondary) {
    switch(filters.primary) {
      case 'by-room':
        filtered = filtered.filter(p => 
          p.tags.rooms.includes(filters.secondary)
        );
        break;
      case 'by-activity':
        filtered = filtered.filter(p => 
          p.tags.activityType.includes(filters.secondary)
        );
        break;
      case 'by-time':
        filtered = filtered.filter(p => 
          matchesDuration(p.totalTime, filters.secondary)
        );
        break;
    }
  }
  
  // Template toggle
  if (filters.templatesOnly) {
    filtered = filtered.filter(p => p.isTemplate);
  }
  
  // Sort by tier for template view
  if (filters.primary === 'templates') {
    filtered.sort((a, b) => a.tier - b.tier);
  }
  
  return filtered;
}
```

### 3. Template Badge Design
```jsx
<TemplateBadge>
  <SparkleIcon /> Template
</TemplateBadge>
```
- Use distinct visual indicator (sparkle icon ✨)
- Different color from regular playbooks
- Appears on card and in playbook header

### 4. Tier-Based Display
When showing templates, group by tier with section headers:
- Tier 1: Large cards, featured placement
- Tier 2: Standard cards, grouped by room
- Tier 3: Standard cards, grouped by specialty type
- Tier 4: Smaller cards or collapsed section

