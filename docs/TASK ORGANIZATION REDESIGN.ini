```typescript
// In Index.tsx or appropriate parent component

// Get today's date for comparison
const today = format(new Date(), 'yyyy-MM-dd');

// Priority tasks (from daily review - already have these)
const priorityTasks = tasks.filter(t => 
  dailyReviewPriorities.includes(t.id)
).slice(0, 3);

// Tasks scheduled for today (excluding priorities)
const todayTasks = tasks.filter(t => 
  t.dueDate === today && 
  !dailyReviewPriorities.includes(t.id)
);

// All tasks for library view (grouped by category/project)
const tasksByCategory = groupTasksByCategory(tasks);
