TASK ORGANIZATION REDESIGN

### Context
This builds on the previous duplicate-fix prompt. We're now implementing a comprehensive task organization system that separates "today's focus" from "all tasks library" with different patterns for desktop vs mobile.

**IMPORTANT: User has custom theme enabled - respect all CSS custom properties, no hardcoded colors/opacity.**

### Goal
Create a dual-mode task organization system:
- **Desktop (≥768px)**: Two-panel layout with persistent visibility of both focus and library
- **Mobile (<768px)**: Drawer pattern where library can be opened/closed

